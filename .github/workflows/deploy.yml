name: Deploy Rizoma

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          RIZOMA_SITE: ${{ vars.RIZOMA_SITE || 'https://hugomoraga.github.io' }}
          RIZOMA_BASE: ${{ vars.RIZOMA_BASE || '/rizoma' }}
          RIZOMA_KNDL_ORIGIN: ${{ vars.RIZOMA_KNDL_ORIGIN || 'https://kndl.quicio.qzz.io' }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
        run: npm run build

      - name: Check links
        env:
          RIZOMA_BASE: ${{ vars.RIZOMA_BASE || '/rizoma' }}
        run: npm run links

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
